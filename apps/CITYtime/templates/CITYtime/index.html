<!DOCTYPE html>
<html>
<head><title>City Time</title></head>
<body>
  <h1>City Time</h1>
  <form method="get">
    <select name="city">
      {% for c in cities %}
        <option value="{{ c }}" {% if c == city %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>
    <button type="submit">Show Time</button>
  </form>
  <p>Current time in {{ city }}: {{ time }}</p>
</body>
</html>
